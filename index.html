<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<meta name="description" content="Foto in Punktwolke mit Rauchfahne verwandeln">
<link rel="manifest" href="manifest.json">
<title>Punktwolke 03A</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;background:#1a1a1a;color:#eee;min-height:100vh;}
header{background:#111;padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #333;}
header svg{flex-shrink:0;}
header h1{font-size:12px;font-weight:500;color:#fff;letter-spacing:.01em;white-space:nowrap;}
.main{padding:12px;max-width:800px;margin:0 auto;}
.dz{border:2px dashed #444;border-radius:12px;padding:20px;text-align:center;cursor:pointer;background:#222;position:relative;margin-bottom:12px;transition:border-color .2s;}
.dz:hover{border-color:#888;}
.dz.loaded{border-color:#4caf50;border-style:solid;}
.dz input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.dz .lbl{font-size:13px;color:#888;}
.controls{background:#222;border-radius:12px;border:1px solid #333;padding:12px 14px;margin-bottom:12px;display:grid;gap:8px;}
.sec{font-size:10px;font-weight:600;color:#666;letter-spacing:.08em;margin-top:6px;}
.cr{display:flex;align-items:center;gap:8px;}
.cr label{font-size:12px;color:#aaa;min-width:130px;}
.cr input[type=range]{flex:1;accent-color:#fff;}
.cr .val{font-size:12px;font-weight:600;min-width:52px;text-align:right;color:#fff;}
.cr select{flex:1;font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid #444;background:#333;color:#eee;}

/* ── Richtungsregler ── */
.dir-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.dir-row > label{font-size:12px;color:#aaa;min-width:130px;flex-shrink:0;}
.dir-controls{display:flex;align-items:center;gap:10px;flex:1;flex-wrap:wrap;}
.dial{
  width:54px;height:54px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#3a3a3a,#1e1e1e);
  border:2px solid #555;position:relative;
  cursor:grab;touch-action:none;user-select:none;flex-shrink:0;outline:none;
}
.dial:focus{border-color:#aaa;}
.dial:active{cursor:grabbing;}
.dial-tick{position:absolute;width:2px;height:5px;background:#3a3a3a;border-radius:1px;
  top:4px;left:50%;margin-left:-1px;transform-origin:1px 23px;}
.dial-tick.major{background:#555;height:7px;}
.dial-needle{
  position:absolute;top:50%;left:50%;
  width:2px;height:19px;
  background:linear-gradient(to top,#fff,rgba(255,255,255,0.3));
  border-radius:1px;transform-origin:50% 100%;
  margin-left:-1px;margin-top:-19px;
}
.dial-info{display:flex;flex-direction:column;gap:1px;min-width:70px;}
.dial-sym{font-size:17px;line-height:1.2;}
.dial-lbl{font-size:10px;color:#888;}
.dial-deg{font-size:10px;color:#555;}
.dir-slider-wrap{display:flex;flex-direction:column;gap:3px;flex:1;min-width:100px;}
.dir-slider-wrap input[type=range]{width:100%;accent-color:#fff;}
.dir-slider-label{font-size:10px;color:#555;text-align:center;}

.canvas-wrap{border-radius:12px;overflow:hidden;background:#111;margin-bottom:10px;position:relative;}
canvas{display:block;width:100%;height:auto;background:#111;}
.prev-badge{
  position:absolute;bottom:8px;right:10px;font-size:10px;color:#555;
  background:rgba(0,0,0,.5);padding:2px 6px;border-radius:4px;pointer-events:none;
}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}
button{font-size:13px;padding:10px 18px;border-radius:8px;border:1px solid #444;background:#333;color:#eee;cursor:pointer;font-weight:500;}
button:hover{background:#444;}
button.primary{background:#fff;color:#111;border-color:#fff;}
button.primary:hover{background:#ddd;}
button:disabled{opacity:.4;cursor:default;}
.save-info{font-size:11px;color:#666;margin-top:6px;}
</style>
</head>
<body>
<header>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
    <circle cx="6" cy="6" r="3" fill="#fff"/>
    <circle cx="14" cy="5" r="2" fill="#fff" opacity=".7"/>
    <circle cx="9" cy="13" r="2.5" fill="#fff" opacity=".8"/>
    <circle cx="18" cy="11" r="1.5" fill="#fff" opacity=".5"/>
    <circle cx="4" cy="17" r="2" fill="#fff" opacity=".4"/>
    <circle cx="20" cy="18" r="1" fill="#fff" opacity=".3"/>
  </svg>
  <h1>Punktwolke 03C &nbsp;©&thinsp;Alois Auer –&thinsp;2026</h1>
</header>

<div class="main">
  <div class="dz" id="dz">
    <input type="file" accept="image/*" id="fileIn">
    <div class="lbl" id="dzLbl">Foto laden — tippen oder hineinziehen</div>
  </div>

  <div class="controls">
    <div class="sec">PUNKTE</div>
    <div class="cr">
      <label>Punktgrösse</label>
      <input type="range" id="ptSize" min="1" max="200" value="60" step="1">
      <span class="val" id="ptSizeV">6.0 px</span>
    </div>
    <div class="cr">
      <label>Punktdichte</label>
      <input type="range" id="density" min="1" max="100" value="20" step="1">
      <span class="val" id="densityV">● ● ○</span>
    </div>
    <div class="cr">
      <label>Raster</label>
      <select id="gridType">
        <option value="hex">Hexagonal</option>
        <option value="square">Quadratisch</option>
        <option value="triangle">Dreieck</option>
      </select>
      <span class="val" style="min-width:0"></span>
    </div>
    <div class="cr">
      <label>Transparenz</label>
      <input type="range" id="ptAlpha" min="10" max="100" value="90" step="1">
      <span class="val" id="ptAlphaV">90%</span>
    </div>
    <div class="cr">
      <label>Farbsättigung</label>
      <input type="range" id="saturation" min="0" max="100" value="100" step="1">
      <span class="val" id="saturationV">100%</span>
    </div>

    <div class="sec">ORIGINALBILD</div>
    <div class="cr">
      <label>Überlagerung</label>
      <input type="range" id="origAlpha" min="0" max="100" value="0" step="1">
      <span class="val" id="origAlphaV">0%</span>
    </div>

    <div class="sec">RAUCHFAHNE</div>
    <div class="dir-row">
      <label>Richtung</label>
      <div class="dir-controls">
        <div class="dial" id="dirDial" tabindex="0" title="Ziehen · ↑↓ Tasten (+15°)">
          <div class="dial-needle" id="dialNeedle"></div>
        </div>
        <div class="dial-info">
          <span class="dial-sym" id="dialSym">→</span>
          <span class="dial-lbl" id="dialLbl">rechts</span>
          <span class="dial-deg" id="dialDeg">0°</span>
        </div>
        <div class="dir-slider-wrap">
          <!-- Schieber: links=0°(rechts) → rechts=345° (gegen UZS = umgekehrt) -->
          <input type="range" id="dirSlider" min="0" max="23" value="0" step="1">
          <div class="dir-slider-label">← gegen Uhrzeigersinn &nbsp;·&nbsp; im Uhrzeigersinn →</div>
        </div>
      </div>
    </div>
    <div class="cr">
      <label>Länge</label>
      <input type="range" id="tailLen" min="0" max="150" value="60" step="1">
      <span class="val" id="tailLenV">60%</span>
    </div>
    <div class="cr">
      <label>Schwung</label>
      <input type="range" id="curl" min="-80" max="80" value="25" step="1">
      <span class="val" id="curlV">25</span>
    </div>
    <div class="cr">
      <label>Kurve (Bogen)</label>
      <input type="range" id="curvature" min="-45" max="45" value="0" step="1">
      <span class="val" id="curvatureV">0°</span>
    </div>
    <div class="cr">
      <label>Kurve ab</label>
      <input type="range" id="curveStart" min="0" max="100" value="67" step="1">
      <span class="val" id="curveStartV">67%</span>
    </div>
    <div class="cr">
      <label>Streuung</label>
      <input type="range" id="spread" min="0" max="80" value="30" step="1">
      <span class="val" id="spreadV">30</span>
    </div>
    <div class="cr">
      <label>Verflüchtigung</label>
      <input type="range" id="dissolve" min="0" max="100" value="60" step="1">
      <span class="val" id="dissolveV">60%</span>
    </div>
    <div class="cr">
      <label>Endbreite</label>
      <input type="range" id="endWidth" min="0" max="100" value="0" step="1">
      <span class="val" id="endWidthV">0%</span>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="cv"></canvas>
    <div class="prev-badge" id="prevBadge"></div>
  </div>

  <div class="btn-row">
    <button class="primary" id="dlBtn">💾 Speichern als JPG</button>
    <button id="reBtn">Neu zeichnen</button>
  </div>
  <div class="save-info" id="saveInfo"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// GLOBALS
// ═══════════════════════════════════════════════════════════════════════════
let srcImg       = null;
let srcFileName  = 'punktwolke';   // Originalname ohne Extension
let dotDataPrev  = [];
let saveIdx      = 1;
let lastSaveName = localStorage.getItem('pw_lastSaveName') || '';
let dirAngle     = 0;              // 0–345°, 15°-Schritte
let renderTimer  = null;

const PREV_MAX = 800;

const cv = document.getElementById('cv');
let gl=null, glProg=null, glBuf=null, useGL=false;

function g(id){ return document.getElementById(id); }
function ptSizeVal(){ return +g('ptSize').value / 10; }

// Punktdichte → Schrittweite in Pixeln
// Slider 1 (links, grob) → step 60, Slider 100 (rechts, dicht) → step 1
function densityStep(){
  const v = +g('density').value;
  return Math.max(1, Math.round(60 * Math.pow(1/60, (v-1)/99)));
}

// ═══════════════════════════════════════════════════════════════════════════
// WEBGL SETUP
// ═══════════════════════════════════════════════════════════════════════════
function initWebGL(){
  try{
    gl = cv.getContext('webgl',{antialias:true,preserveDrawingBuffer:true})
      || cv.getContext('experimental-webgl',{antialias:true,preserveDrawingBuffer:true});
    if(!gl) throw 'no webgl';
    const vs=`
      attribute vec2 a_pos; attribute vec4 a_color; attribute float a_size;
      uniform vec2 u_res; varying vec4 v_color;
      void main(){
        vec2 clip=(a_pos/u_res)*2.0-1.0;
        gl_Position=vec4(clip.x,-clip.y,0,1);
        gl_PointSize=a_size; v_color=a_color;
      }`;
    const fs=`
      precision mediump float; varying vec4 v_color;
      void main(){
        float d=length(gl_PointCoord-vec2(0.5));
        if(d>0.5) discard;
        gl_FragColor=v_color;
      }`;
    const cs=(type,src)=>{
      const s=gl.createShader(type);
      gl.shaderSource(s,src); gl.compileShader(s);
      if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
      return s;
    };
    glProg=gl.createProgram();
    gl.attachShader(glProg,cs(gl.VERTEX_SHADER,vs));
    gl.attachShader(glProg,cs(gl.FRAGMENT_SHADER,fs));
    gl.linkProgram(glProg);
    if(!gl.getProgramParameter(glProg,gl.LINK_STATUS)) throw gl.getProgramInfoLog(glProg);
    glBuf=gl.createBuffer();
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    useGL=true;
  }catch(e){ console.warn('WebGL Fallback Canvas2D:',e); useGL=false; }
}

// ═══════════════════════════════════════════════════════════════════════════
// RICHTUNGSREGLER
// ═══════════════════════════════════════════════════════════════════════════
const dial      = g('dirDial');
const dialNeedle= g('dialNeedle');
const dirSlider = g('dirSlider');

for(let i=0;i<24;i++){
  const t=document.createElement('div');
  t.className='dial-tick'+(i%6===0?' major':'');
  t.style.transform=`rotate(${i*15}deg)`;
  dial.appendChild(t);
}
dial.appendChild(dialNeedle);

const DIR_TABLE=[
  {sym:'→',lbl:'rechts'},         {sym:'↘',lbl:'+15°'},
  {sym:'↘',lbl:'+30°'},           {sym:'↘',lbl:'rechts-unten'},
  {sym:'↓',lbl:'+60°'},           {sym:'↓',lbl:'+75°'},
  {sym:'↓',lbl:'unten'},          {sym:'↙',lbl:'+105°'},
  {sym:'↙',lbl:'+120°'},          {sym:'↙',lbl:'links-unten'},
  {sym:'←',lbl:'+150°'},          {sym:'←',lbl:'+165°'},
  {sym:'←',lbl:'links'},          {sym:'↖',lbl:'+195°'},
  {sym:'↖',lbl:'+210°'},          {sym:'↖',lbl:'links-oben'},
  {sym:'↑',lbl:'+240°'},          {sym:'↑',lbl:'+255°'},
  {sym:'↑',lbl:'oben'},           {sym:'↗',lbl:'+285°'},
  {sym:'↗',lbl:'+300°'},          {sym:'↗',lbl:'rechts-oben'},
  {sym:'→',lbl:'+330°'},          {sym:'→',lbl:'+345°'},
];

function updateDialUI(){
  dialNeedle.style.transform=`rotate(${dirAngle+90}deg)`;
  const idx=Math.round(dirAngle/15)%24;
  g('dialSym').textContent=DIR_TABLE[idx].sym;
  g('dialLbl').textContent=DIR_TABLE[idx].lbl;
  g('dialDeg').textContent=dirAngle+'°';
  // Schieber: gegen Uhrzeigersinn = links, im Uhrzeigersinn = rechts
  // Schritt 0=0°, 1=15°, …, 23=345° → aber Richtung umdrehen:
  // Wert 0 links = 0°, nach rechts dreht im Uhrzeigersinn (= steigende Winkel)
  // ABER User will: links=gegen UZS, rechts=im UZS
  // gegen UZS = steigende Winkel von 0 nach rechts (0°,15°,30°...) ← standard
  // „Schieber Richtung umdrehen": Schieber-links = hoher Winkel, rechts = niedriger
  // Wir mappen: Schieber-Wert v (0..23) → Winkel = (23-v)*15
  const sliderVal = Math.round((360 - dirAngle) / 15) % 24;
  if(+dirSlider.value !== sliderVal) dirSlider.value = sliderVal;
}

function setDirAngle(a){
  dirAngle=Math.round(((a%360)+360)%360/15)*15%360;
  updateDialUI();
  scheduleRender();
}

// Drag
let dragging=false, dragLastA=0;
function evAngle(e){
  const r=dial.getBoundingClientRect();
  const px=e.touches?e.touches[0].clientX:e.clientX;
  const py=e.touches?e.touches[0].clientY:e.clientY;
  return Math.atan2(py-(r.top+r.height/2),px-(r.left+r.width/2))*180/Math.PI;
}
dial.addEventListener('mousedown', e=>{ dragging=true; dragLastA=evAngle(e); dial.focus(); e.preventDefault(); });
dial.addEventListener('touchstart',e=>{ dragging=true; dragLastA=evAngle(e); e.preventDefault(); },{passive:false});
window.addEventListener('mousemove',e=>{
  if(!dragging)return;
  const a=evAngle(e); let d=a-dragLastA;
  if(d>180)d-=360; if(d<-180)d+=360;
  dragLastA=a; setDirAngle(dirAngle+d);
});
window.addEventListener('touchmove',e=>{
  if(!dragging)return;
  const a=evAngle(e); let d=a-dragLastA;
  if(d>180)d-=360; if(d<-180)d+=360;
  dragLastA=a; setDirAngle(dirAngle+d);
},{passive:false});
window.addEventListener('mouseup', ()=>{ dragging=false; });
window.addEventListener('touchend',()=>{ dragging=false; });
dial.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'  ||e.key==='ArrowRight'){ setDirAngle(dirAngle+15); e.preventDefault(); }
  if(e.key==='ArrowDown'||e.key==='ArrowLeft') { setDirAngle(dirAngle-15); e.preventDefault(); }
});

// Schieber: Wert 0 (links) = 0°, nach rechts im Uhrzeigersinn
// Umkehr: Schieber-Wert v → Winkel = (23-v)*15 war alte Idee
// Jetzt: links=gegen UZS geht zu 0, rechts geht zu 345 → Schieber normal
// ABER „Richtung umdrehen" bedeutet: Schieber-links = größter Winkel
// → Winkel = (23 - sliderVal) * 15
dirSlider.addEventListener('input',function(){
  const angle = (24 - +this.value) % 24 * 15;
  setDirAngle(angle);
});

// ═══════════════════════════════════════════════════════════════════════════
// SLIDER
// ═══════════════════════════════════════════════════════════════════════════
function bindSlider(id,outId,suffix,dispFn,fn){
  g(id).addEventListener('input',function(){
    const v=+this.value;
    g(outId).textContent=(dispFn?dispFn(v):Math.round(v))+suffix;
    if(fn)fn();
  });
}
function densityDisplay(v){
  const s=Math.round(60*Math.pow(1/60,(v-1)/99));
  if(s>=30)return '● ○ ○';
  if(s>=8) return '● ● ○';
  return '● ● ●';
}
bindSlider('ptSize',   'ptSizeV',    ' px',v=>(v/10).toFixed(1),scheduleRender);
bindSlider('density',  'densityV',   '',   densityDisplay,()=>{buildPrevDots();scheduleRender();});
bindSlider('ptAlpha',  'ptAlphaV',   '%',  null,scheduleRender);
bindSlider('saturation','saturationV','%', null,scheduleRender);
bindSlider('origAlpha','origAlphaV', '%',  null,scheduleRender);
bindSlider('tailLen',  'tailLenV',   '%',  null,scheduleRender);
bindSlider('curl',     'curlV',      '',   null,scheduleRender);
bindSlider('curvature', 'curvatureV',  '°', null,scheduleRender);
bindSlider('curveStart','curveStartV','%', null,scheduleRender);
bindSlider('spread',   'spreadV',    '',   null,scheduleRender);
bindSlider('dissolve',  'dissolveV',  '%', null,scheduleRender);
bindSlider('endWidth',  'endWidthV',  '%', null,scheduleRender);
g('gridType').addEventListener('change',()=>{buildPrevDots();scheduleRender();});

// ═══════════════════════════════════════════════════════════════════════════
// BILD LADEN
// ═══════════════════════════════════════════════════════════════════════════
g('fileIn').addEventListener('change',function(){
  if(!this.files[0])return;
  // Dateiname ohne Extension merken
  srcFileName = this.files[0].name.replace(/\.[^.]+$/,'');
  saveIdx = 1; // Index zurücksetzen bei neuem Bild
  const r=new FileReader();
  r.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      srcImg=img;
      g('dz').classList.add('loaded');
      g('dzLbl').textContent=this.files[0].name;
      buildPrevDots();
      render();
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(this.files[0]);
});

// ═══════════════════════════════════════════════════════════════════════════
// HILFSFUNKTIONEN
// ═══════════════════════════════════════════════════════════════════════════
function adjustSaturation(r,g,b,satPct){
  if(satPct>=100)return[r,g,b];
  const gray=Math.round(((Math.max(r,g,b)+Math.min(r,g,b))/2/255)*255);
  const f=satPct/100;
  return[Math.round(gray+(r-gray)*f),Math.round(gray+(g-gray)*f),Math.round(gray+(b-gray)*f)];
}
function previewScale(){
  if(!srcImg)return 1;
  return Math.min(PREV_MAX/srcImg.width,PREV_MAX/srcImg.height,1);
}

// ═══════════════════════════════════════════════════════════════════════════
// RASTERPUNKTE SAMPELN
// ═══════════════════════════════════════════════════════════════════════════
function sampleDots(imgEl, targetW, targetH, step, gridType){
  const offC=document.createElement('canvas');
  offC.width=targetW; offC.height=targetH;
  const offCtx=offC.getContext('2d');
  offCtx.drawImage(imgEl,0,0,targetW,targetH);
  const px=offCtx.getImageData(0,0,targetW,targetH).data;
  const dots=[];
  const s=Math.max(0.5,step);

  if(gridType==='hex'){
    // Hexagonalraster: gerade Zeilen normal, ungerade um s/2 versetzt
    // Zeilenabstand = s * sqrt(3)/2 für dichteste Packung
    const rowH = s * Math.sqrt(3)/2;
    let row=0;
    for(let y=rowH/2; y<targetH; y+=rowH, row++){
      const xOffset = (row%2===0) ? s/2 : s;
      for(let x=xOffset; x<targetW; x+=s){
        const xi=Math.floor(x), yi=Math.floor(y);
        if(xi<0||xi>=targetW||yi<0||yi>=targetH)continue;
        const i=(yi*targetW+xi)*4;
        if(px[i+3]<10)continue;
        dots.push({nx:x/targetW,ny:y/targetH,r:px[i],g:px[i+1],b:px[i+2],a:px[i+3]});
      }
    }
  } else if(gridType==='triangle'){
    // Gleichseitiges Dreieckraster: zwei versetzte Hex-Raster überlagert
    // = Hex-Raster mit halbem Zeilenversatz
    const rowH = s * Math.sqrt(3)/2;
    let row=0;
    for(let y=rowH/2; y<targetH; y+=rowH, row++){
      const xOff = (row%2===0) ? s/4 : s*3/4;
      for(let x=xOff; x<targetW; x+=s){
        const xi=Math.floor(x), yi=Math.floor(y);
        if(xi<0||xi>=targetW||yi<0||yi>=targetH)continue;
        const i=(yi*targetW+xi)*4;
        if(px[i+3]<10)continue;
        dots.push({nx:x/targetW,ny:y/targetH,r:px[i],g:px[i+1],b:px[i+2],a:px[i+3]});
      }
    }
  } else {
    // Quadratisches Raster
    for(let y=s/2; y<targetH; y+=s){
      for(let x=s/2; x<targetW; x+=s){
        const xi=Math.floor(x), yi=Math.floor(y);
        if(xi<0||xi>=targetW||yi<0||yi>=targetH)continue;
        const i=(yi*targetW+xi)*4;
        if(px[i+3]<10)continue;
        dots.push({nx:x/targetW,ny:y/targetH,r:px[i],g:px[i+1],b:px[i+2],a:px[i+3]});
      }
    }
  }
  return dots;
}

function buildPrevDots(){
  if(!srcImg)return;
  const sc=previewScale();
  const prevW=Math.round(srcImg.width*sc);
  const prevH=Math.round(srcImg.height*sc);
  const step=densityStep()*sc;
  const gt=g('gridType').value;
  dotDataPrev=sampleDots(srcImg,prevW,prevH,step,gt);
}

// ═══════════════════════════════════════════════════════════════════════════
// CANVAS-DIMENSIONEN
// ═══════════════════════════════════════════════════════════════════════════
function canvasDims(imgW,imgH,tailLen,dx,dy){
  const tailPx=Math.max(imgW,imgH)*tailLen;
  const padRight =dx>0?tailPx*dx:0;
  const padLeft  =dx<0?tailPx*(-dx):0;
  const padBottom=dy>0?tailPx*dy:0;
  const padTop   =dy<0?tailPx*(-dy):0;
  return{
    w:Math.ceil(imgW+padRight+padLeft),
    h:Math.ceil(imgH+padBottom+padTop),
    imgX:padLeft, imgY:padTop
  };
}

// ═══════════════════════════════════════════════════════════════════════════
// KURVE/BOGEN: Berechnet gekrümmten Pfad für Rauchfahnen-Punkt
// curvatureDeg: –45..+45 (negativ=gegen UZS, positiv=im UZS)
// t: 0..1 entlang der Fahne
// dx,dy: Hauptrichtung
// gibt {x,y} delta vom Ursprung zurück
// ═══════════════════════════════════════════════════════════════════════════
function curvedOffset(t, dist, dx, dy, curvatureDeg){
  if(Math.abs(curvatureDeg) < 0.5){
    return { x: dx*dist, y: dy*dist };
  }
  // Bogenradius aus Kurvatur (Bogenlänge = dist, Mittelpunktswinkel = curvatureDeg*t)
  const totalAngle = curvatureDeg * Math.PI/180;
  // Radius so wählen, dass Bogenlänge = dist
  // Bogenlänge = r * winkel → r = dist / winkel (wenn winkel != 0)
  const radius = dist / Math.abs(totalAngle);
  // Winkel des Bogens bis t
  const arcAngle = totalAngle * t;
  // Senkrechte zur Hauptrichtung (Krümmungsachse)
  const perpX = -dy, perpY = dx;
  // Kreismittelpunkt liegt senkrecht zur Richtung in Abstand radius
  const sign = totalAngle > 0 ? 1 : -1;
  const cx = perpX * radius * sign;
  const cy = perpY * radius * sign;
  // Punkt auf dem Bogen
  const startAngle = Math.atan2(-dy, -dx) + Math.PI; // Richtung von Mitte zum Start
  // Einfacher: Bogen-Formel direkt
  const cosA = Math.cos(arcAngle), sinA = Math.sin(arcAngle);
  // Rotation der Richtung um arcAngle
  const rdx = dx*cosA - dy*sinA * sign;
  const rdy = dx*sinA * sign + dy*cosA;
  // Integrierter Bogenpunkt (Kreisformel)
  const bx = cx + (-cx)*cosA - (-cy)*sinA;
  const by = cy + (-cx)*sinA + (-cy)*cosA;
  return { x: bx, y: by };
}

// ═══════════════════════════════════════════════════════════════════════════
// VERTICES BAUEN (für WebGL)
// ═══════════════════════════════════════════════════════════════════════════
function buildVertices(dots, imgW, imgH, scaleFactor, params){
  const{ptSize,ptAlpha,curl,curvature,curveStart,spread,dissolve,endWidth,satPct,tailLen,dx,dy}=params;
  const tailPx=Math.max(imgW,imgH)*tailLen;
  const padLeft=dx<0?tailPx*(-dx):0;
  const padTop =dy<0?tailPx*(-dy):0;
  const imgX=padLeft, imgY=padTop;
  const ptR=(ptSize/2)*scaleFactor;
  const STEPS=18;
  const perpX=-dy, perpY=dx;
  const verts=[];

  dots.forEach(d=>{
    const[sr,sg,sb]=adjustSaturation(d.r,d.g,d.b,satPct);
    const baseA=ptAlpha*d.a/255;
    const px=imgX+d.nx*imgW;
    const py=imgY+d.ny*imgH;
    verts.push(px,py,sr/255,sg/255,sb/255,baseA,Math.max(0.5,ptR*2));
    if(tailLen<=0)return;
    for(let s=1;s<=STEPS;s++){
      const t=s/STEPS;
      const dist=t*tailPx;
      const noise=(Math.random()-0.5)*spread*scaleFactor*t*2;
      const curlOff=curl*scaleFactor*t*t;
      // Kurve erst ab curveStart: lokales t innerhalb des Kurvenbereichs
      const tCurve = t < curveStart ? 0 : (t - curveStart) / (1 - curveStart + 0.001);
      const bo=curvedOffset(tCurve, dist, dx, dy, curvature);
      const tx=px+bo.x+perpX*(curlOff+noise);
      const ty=py+bo.y+perpY*(curlOff+noise);
      const alpha=baseA*Math.pow(1-t,1.2)*(1-dissolve*t*0.9);
      if(alpha<=0.01)continue;
      // Endbreite: 0%=spitz(auf 0 zusammenlaufend), 100%=gleichbleibend
      // Grösse = ptR * (endWidth + (1-endWidth)*(1-t)) bei dissolve=0
      const widthFactor = endWidth + (1-endWidth)*(1-t);
      const sz=Math.max(0.5, ptR*2 * widthFactor * (1 - dissolve*(1-endWidth)*t*0.7));
      verts.push(tx,ty,sr/255,sg/255,sb/255,Math.min(1,alpha),sz);
    }
  });
  return new Float32Array(verts);
}

// ═══════════════════════════════════════════════════════════════════════════
// WEBGL RENDER
// ═══════════════════════════════════════════════════════════════════════════
function renderWebGL(dots, imgW, imgH, scaleFactor, params){
  const{origAlpha,tailLen,dx,dy}=params;
  const{w,h,imgX,imgY}=canvasDims(imgW,imgH,tailLen,dx,dy);

  // Wenn Überlagerung aktiv: alles auf Offscreen-Canvas2D, dann als Bild in CV
  // Das vermeidet WebGL/2D-Kontext-Konflikte vollständig.
  if(origAlpha>0){
    const tmp=document.createElement('canvas');
    tmp.width=w; tmp.height=h;
    const t2=tmp.getContext('2d');
    t2.fillStyle='#111'; t2.fillRect(0,0,w,h);
    t2.globalAlpha=origAlpha;
    t2.drawImage(srcImg,imgX,imgY,imgW,imgH);
    t2.globalAlpha=1;
    _drawPoints2D(t2,dots,imgW,imgH,scaleFactor,params,imgX,imgY);
    // Ergebnis in GL-Canvas via Textur-Blit
    cv.width=w; cv.height=h;
    gl.viewport(0,0,w,h);
    gl.clearColor(17/255,17/255,17/255,1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    if(!glTexProg)_initTexProg();
    const tex=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,tmp);
    gl.useProgram(glTexProg);
    gl.bindBuffer(gl.ARRAY_BUFFER,glQuadBuf);
    const aT=gl.getAttribLocation(glTexProg,'a_pos');
    gl.enableVertexAttribArray(aT);
    gl.vertexAttribPointer(aT,2,gl.FLOAT,false,0,0);
    gl.uniform1i(gl.getUniformLocation(glTexProg,'u_tex'),0);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    gl.deleteTexture(tex);
    return;
  }

  // Kein Overlay: schneller WebGL-Punktrender
  cv.width=w; cv.height=h;
  gl.viewport(0,0,w,h);
  gl.clearColor(17/255,17/255,17/255,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  const verts=buildVertices(dots,imgW,imgH,scaleFactor,params);
  const STRIDE=7;
  gl.useProgram(glProg);
  gl.bindBuffer(gl.ARRAY_BUFFER,glBuf);
  gl.bufferData(gl.ARRAY_BUFFER,verts,gl.DYNAMIC_DRAW);
  const bpe=Float32Array.BYTES_PER_ELEMENT;
  gl.uniform2f(gl.getUniformLocation(glProg,'u_res'),w,h);
  const aPos=gl.getAttribLocation(glProg,'a_pos');
  const aCol=gl.getAttribLocation(glProg,'a_color');
  const aSz =gl.getAttribLocation(glProg,'a_size');
  gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,STRIDE*bpe,0);
  gl.enableVertexAttribArray(aCol); gl.vertexAttribPointer(aCol,4,gl.FLOAT,false,STRIDE*bpe,2*bpe);
  gl.enableVertexAttribArray(aSz);  gl.vertexAttribPointer(aSz, 1,gl.FLOAT,false,STRIDE*bpe,6*bpe);
  gl.drawArrays(gl.POINTS,0,verts.length/STRIDE);
}

let glTexProg=null,glQuadBuf=null;
function _initTexProg(){
  const vs=`attribute vec2 a_pos;varying vec2 v_uv;void main(){v_uv=a_pos*0.5+0.5;gl_Position=vec4(a_pos,0,1);}`;
  const fs=`precision mediump float;uniform sampler2D u_tex;varying vec2 v_uv;void main(){gl_FragColor=texture2D(u_tex,v_uv);}`;
  const cs=(t,s)=>{const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);return sh;};
  glTexProg=gl.createProgram();
  gl.attachShader(glTexProg,cs(gl.VERTEX_SHADER,vs));
  gl.attachShader(glTexProg,cs(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(glTexProg);
  glQuadBuf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,glQuadBuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
}

// ═══════════════════════════════════════════════════════════════════════════
// CANVAS2D RENDER (Fallback + Export)
// ═══════════════════════════════════════════════════════════════════════════

// Interne Hilfsfunktion: nur Punkte zeichnen (kein Hintergrund, kein Bild)
function _drawPoints2D(tCtx, dots, imgW, imgH, scaleFactor, params, imgX, imgY){
  const{ptSize,ptAlpha,curl,curvature,curveStart,spread,dissolve,endWidth,satPct,tailLen,dx,dy}=params;
  const ptR=(ptSize/2)*scaleFactor;
  const STEPS=18;
  const perpX=-dy, perpY=dx;
  dots.forEach(d=>{
    const[sr,sg,sb]=adjustSaturation(d.r,d.g,d.b,satPct);
    const baseA=ptAlpha*d.a/255;
    const px=imgX+d.nx*imgW;
    const py=imgY+d.ny*imgH;
    tCtx.beginPath();
    tCtx.arc(px,py,Math.max(0.3,ptR),0,Math.PI*2);
    tCtx.fillStyle=`rgba(${sr},${sg},${sb},${baseA})`;
    tCtx.fill();
    if(tailLen<=0)return;
    for(let s=1;s<=STEPS;s++){
      const t=s/STEPS;
      const dist=t*Math.max(imgW,imgH)*tailLen;
      const noise=(Math.random()-0.5)*spread*scaleFactor*t*2;
      const curlOff=curl*scaleFactor*t*t;
      // Kurve erst ab curveStart
      const tCurve = t < curveStart ? 0 : (t - curveStart) / (1 - curveStart + 0.001);
      const bo=curvedOffset(tCurve, dist, dx, dy, curvature);
      const tx=px+bo.x+perpX*(curlOff+noise);
      const ty=py+bo.y+perpY*(curlOff+noise);
      const alpha=baseA*Math.pow(1-t,1.2)*(1-dissolve*t*0.9);
      if(alpha<=0.01)continue;
      // Endbreite: 0=spitz, 100=gleichbleibend
      const widthFactor = endWidth + (1-endWidth)*(1-t);
      const sz=Math.max(0.3, ptR * widthFactor * (1 - dissolve*(1-endWidth)*t*0.7));
      tCtx.beginPath();
      tCtx.arc(tx,ty,sz,0,Math.PI*2);
      tCtx.fillStyle=`rgba(${sr},${sg},${sb},${Math.min(1,alpha)})`;
      tCtx.fill();
    }
  });
}

// Vollständiger Canvas2D-Render: Hintergrund + Bild + Punkte
function renderCanvas2D(tCtx, tCanvas, dots, imgW, imgH, scaleFactor, params){
  const{origAlpha,tailLen,dx,dy}=params;
  const{w,h,imgX,imgY}=canvasDims(imgW,imgH,tailLen,dx,dy);
  tCanvas.width=w; tCanvas.height=h;
  tCtx.fillStyle='#111'; tCtx.fillRect(0,0,w,h);
  if(origAlpha>0){
    tCtx.globalAlpha=origAlpha;
    tCtx.drawImage(srcImg,imgX,imgY,imgW,imgH);
    tCtx.globalAlpha=1;
  }
  _drawPoints2D(tCtx,dots,imgW,imgH,scaleFactor,params,imgX,imgY);
}

// ═══════════════════════════════════════════════════════════════════════════
// RENDER VORSCHAU
// ═══════════════════════════════════════════════════════════════════════════
function scheduleRender(){
  clearTimeout(renderTimer);
  renderTimer=setTimeout(render,20);
}

function render(){
  if(!srcImg){
    if(useGL){
      cv.width=600; cv.height=300;
      gl.viewport(0,0,600,300);
      gl.clearColor(17/255,17/255,17/255,1);
      gl.clear(gl.COLOR_BUFFER_BIT);
    } else {
      const c2=cv.getContext('2d');
      cv.width=600; cv.height=300;
      c2.fillStyle='#111'; c2.fillRect(0,0,600,300);
      c2.fillStyle='#444'; c2.font='14px system-ui'; c2.textAlign='center';
      c2.fillText('Bitte ein Foto laden',300,155);
    }
    g('prevBadge').textContent='';
    return;
  }

  const sc=previewScale();
  const prevW=Math.round(srcImg.width*sc);
  const prevH=Math.round(srcImg.height*sc);
  const aRad=dirAngle*Math.PI/180;
  const params={
    ptSize:     ptSizeVal()*sc,
    ptAlpha:    +g('ptAlpha').value/100,
    curl:       +g('curl').value,
    curvature:  +g('curvature').value,
    curveStart: +g('curveStart').value/100,
    spread:     +g('spread').value,
    dissolve:   +g('dissolve').value/100,
    endWidth:   +g('endWidth').value/100,
    satPct:     +g('saturation').value,
    origAlpha:  +g('origAlpha').value/100,
    tailLen:    +g('tailLen').value/100,
    dx:Math.cos(aRad), dy:Math.sin(aRad),
  };

  if(useGL){
    renderWebGL(dotDataPrev,prevW,prevH,sc,params);
  } else {
    const c2=cv.getContext('2d');
    renderCanvas2D(c2,cv,dotDataPrev,prevW,prevH,sc,params);
  }

  const badge=(srcImg.width>PREV_MAX||srcImg.height>PREV_MAX)
    ?`Vorschau ${prevW}×${prevH} · Original ${srcImg.width}×${srcImg.height}`
    :`${prevW}×${prevH} px`;
  g('prevBadge').textContent=badge;
}

g('reBtn').addEventListener('click',()=>{ buildPrevDots(); render(); });

// ═══════════════════════════════════════════════════════════════════════════
// SPEICHERN — Dateiname = Bildname + _PW_ + Index
// ═══════════════════════════════════════════════════════════════════════════
g('dlBtn').addEventListener('click', async ()=>{
  if(!srcImg)return;
  g('dlBtn').disabled=true;
  g('saveInfo').textContent='Wird berechnet …';
  await new Promise(r=>setTimeout(r,30));

  const oW=srcImg.width, oH=srcImg.height;
  const step=densityStep();
  const gt=g('gridType').value;
  const origDots=sampleDots(srcImg,oW,oH,step,gt);

  const expCanvas=document.createElement('canvas');
  const expCtx=expCanvas.getContext('2d');
  const aRad=dirAngle*Math.PI/180;
  const params={
    ptSize:     ptSizeVal(),
    ptAlpha:    +g('ptAlpha').value/100,
    curl:       +g('curl').value,
    curvature:  +g('curvature').value,
    curveStart: +g('curveStart').value/100,
    spread:     +g('spread').value,
    dissolve:   +g('dissolve').value/100,
    endWidth:   +g('endWidth').value/100,
    satPct:     +g('saturation').value,
    origAlpha:  +g('origAlpha').value/100,
    tailLen:    +g('tailLen').value/100,
    dx:Math.cos(aRad), dy:Math.sin(aRad),
  };
  renderCanvas2D(expCtx,expCanvas,origDots,oW,oH,1,params);

  // Dateiname: Bildname + _PW_ + 001
  const idxStr=String(saveIdx).padStart(3,'0');
  const suggested=`${srcFileName}_PW_${idxStr}`;

  const doSave=blob=>{
    if(window.showSaveFilePicker){
      window.showSaveFilePicker({
        suggestedName:suggested+'.jpg',
        types:[{description:'JPEG Bild',accept:{'image/jpeg':['.jpg','.jpeg']}}]
      }).then(async handle=>{
        const w=await handle.createWritable();
        await w.write(blob); await w.close();
        localStorage.setItem('pw_lastSaveName',handle.name);
        g('saveInfo').textContent=`Gespeichert: ${handle.name}  (${expCanvas.width}×${expCanvas.height} px)`;
        saveIdx++;
      }).catch(()=>{ g('saveInfo').textContent='Abgebrochen.'; })
        .finally(()=>{ g('dlBtn').disabled=false; });
    } else {
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.download=suggested+'.jpg'; a.href=url; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      g('saveInfo').textContent=`Gespeichert: ${suggested}.jpg  (${expCanvas.width}×${expCanvas.height} px)`;
      saveIdx++; g('dlBtn').disabled=false;
    }
  };
  expCanvas.toBlob(doSave,'image/jpeg',0.93);
});

// ═══════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════
initWebGL();
setDirAngle(0);
g('ptSizeV').textContent    =(ptSizeVal()).toFixed(1)+' px';
g('densityV').textContent   =densityDisplay(+g('density').value);
g('ptAlphaV').textContent   ='90%';
g('saturationV').textContent='100%';
g('origAlphaV').textContent ='0%';
g('tailLenV').textContent   ='60%';
g('curlV').textContent      ='25';
g('curvatureV').textContent ='0°';
g('curveStartV').textContent='67%';
g('endWidthV').textContent  ='0%';
g('spreadV').textContent    ='30';
g('dissolveV').textContent  ='60%';
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
