<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<meta name="description" content="Foto in Punktwolke mit Rauchfahne verwandeln">
<link rel="manifest" href="manifest.json">
<title>Punktwolke 02</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;background:#1a1a1a;color:#eee;min-height:100vh;}
header{background:#111;padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #333;}
header h1{font-size:13px;font-weight:500;color:#fff;letter-spacing:.01em;}
header .copy{font-size:10px;color:#555;margin-left:auto;white-space:nowrap;}
.main{padding:12px;max-width:800px;margin:0 auto;}
.dz{border:2px dashed #444;border-radius:12px;padding:20px;text-align:center;cursor:pointer;background:#222;position:relative;margin-bottom:12px;transition:border-color .2s;}
.dz:hover{border-color:#888;}
.dz.loaded{border-color:#4caf50;border-style:solid;}
.dz input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.dz .lbl{font-size:13px;color:#888;}
.controls{background:#222;border-radius:12px;border:1px solid #333;padding:12px 14px;margin-bottom:12px;display:grid;gap:8px;}
.sec{font-size:10px;font-weight:600;color:#666;letter-spacing:.08em;margin-top:6px;}
.cr{display:flex;align-items:center;gap:8px;}
.cr label{font-size:12px;color:#aaa;min-width:130px;}
.cr input[type=range]{flex:1;accent-color:#fff;}
.cr .val{font-size:12px;font-weight:600;min-width:52px;text-align:right;color:#fff;}
/* Drehregler */
.dir-row{display:flex;align-items:center;gap:8px;}
.dir-row > label{font-size:12px;color:#aaa;min-width:130px;}
.dial-wrap{display:flex;align-items:center;gap:10px;flex:1;}
.dial{width:52px;height:52px;border-radius:50%;background:#2a2a2a;border:2px solid #555;position:relative;cursor:grab;touch-action:none;user-select:none;flex-shrink:0;}
.dial:active{cursor:grabbing;border-color:#888;}
.dial-inner{position:absolute;inset:5px;border-radius:50%;border:1px solid #3a3a3a;}
.dial-dot{position:absolute;width:5px;height:5px;background:#fff;border-radius:50%;top:50%;left:50%;margin:-2.5px -2.5px;transform-origin:center center;}
.dial-name{font-size:12px;color:#fff;font-weight:600;}
.canvas-wrap{border-radius:12px;overflow:hidden;background:#111;margin-bottom:10px;}
canvas{display:block;width:100%;height:auto;background:#111;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}
button{font-size:13px;padding:10px 18px;border-radius:8px;border:1px solid #444;background:#333;color:#eee;cursor:pointer;font-weight:500;}
button:hover{background:#444;}
button.primary{background:#fff;color:#111;border-color:#fff;}
button.primary:hover{background:#ddd;}
.save-info{font-size:11px;color:#666;margin-top:6px;}
</style>
</head>
<body>
<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
    <circle cx="6" cy="6" r="3" fill="#fff"/>
    <circle cx="14" cy="5" r="2" fill="#fff" opacity=".7"/>
    <circle cx="9" cy="13" r="2.5" fill="#fff" opacity=".8"/>
    <circle cx="18" cy="11" r="1.5" fill="#fff" opacity=".5"/>
    <circle cx="4" cy="17" r="2" fill="#fff" opacity=".4"/>
    <circle cx="20" cy="18" r="1" fill="#fff" opacity=".3"/>
  </svg>
  <h1>Punktwolke 02</h1>
  <span class="copy">© Alois Auer – 2026</span>
</header>

<div class="main">
  <div class="dz" id="dz">
    <input type="file" accept="image/*" id="fileIn">
    <div class="lbl" id="dzLbl">Foto laden — tippen oder hineinziehen</div>
  </div>

  <div class="controls">
    <div class="sec">PUNKTE</div>
    <div class="cr"><label>Punktgrösse</label><input type="range" id="ptSize" min="1" max="200" value="60" step="1"><span class="val" id="ptSizeV">6.0px</span></div>
    <div class="cr"><label>Punktdichte</label><input type="range" id="density" min="1" max="300" value="80" step="1"><span class="val" id="densityV">8.0</span></div>
    <div class="cr"><label>Punkteanzahl</label><input type="range" id="ptCount" min="0" max="100" value="100" step="1"><span class="val" id="ptCountV">100%</span></div>
    <div class="cr"><label>Mindestabstand</label><input type="range" id="spacing" min="0" max="100" value="0" step="1"><span class="val" id="spacingV">0x</span></div>
    <div class="cr"><label>Transparenz</label><input type="range" id="ptAlpha" min="10" max="100" value="90" step="1"><span class="val" id="ptAlphaV">90%</span></div>
    <div class="cr"><label>Farbsättigung</label><input type="range" id="saturation" min="0" max="100" value="100" step="1"><span class="val" id="saturationV">100%</span></div>

    <div class="sec">ORIGINALBILD</div>
    <div class="cr"><label>Überlagerung</label><input type="range" id="origAlpha" min="0" max="100" value="0" step="1"><span class="val" id="origAlphaV">0%</span></div>

    <div class="sec">RAUCHFAHNE</div>
    <div class="dir-row">
      <label>Richtung</label>
      <div class="dial-wrap">
        <div class="dial" id="dirDial" title="Ziehen zum Drehen · Doppelklick zum Einrasten">
          <div class="dial-inner"></div>
          <div class="dial-dot" id="dialDot"></div>
        </div>
        <span class="dial-name" id="dialName">→ rechts</span>
      </div>
    </div>
    <div class="cr"><label>Länge</label><input type="range" id="tailLen" min="0" max="150" value="60" step="1"><span class="val" id="tailLenV">60%</span></div>
    <div class="cr"><label>Schwung</label><input type="range" id="curl" min="-80" max="80" value="25" step="1"><span class="val" id="curlV">25</span></div>
    <div class="cr"><label>Streuung</label><input type="range" id="spread" min="0" max="80" value="30" step="1"><span class="val" id="spreadV">30</span></div>
    <div class="cr"><label>Auflösung</label><input type="range" id="dissolve" min="0" max="100" value="60" step="1"><span class="val" id="dissolveV">60%</span></div>
  </div>

  <div class="canvas-wrap">
    <canvas id="cv"></canvas>
  </div>

  <div class="btn-row">
    <button class="primary" id="dlBtn">💾 Speichern als JPG</button>
    <button id="reBtn">Neu zeichnen</button>
  </div>
  <div class="save-info" id="saveInfo"></div>
</div>

<script>
let srcImg=null, dotData=[], saveIdx=1;
let lastSaveName = localStorage.getItem('punktwolke_lastSaveName') || 'punktwolke';
let dirAngle = 0; // Grad, 0=rechts, 90=unten, 180=links, 270=oben

const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
function g(id){ return document.getElementById(id); }
function ptSizeVal(){ return +g('ptSize').value / 10; }
function densityVal(){ return +g('density').value / 10; }

// ── Drehregler ──────────────────────────────────────────────────────────────
const dial     = g('dirDial');
const dialDot  = g('dialDot');
const dialName = g('dialName');

const DIR_STEPS = [
  {a:0,   sym:'→', lbl:'rechts'},
  {a:45,  sym:'↘', lbl:'rechts-unten'},
  {a:90,  sym:'↓', lbl:'unten'},
  {a:135, sym:'↙', lbl:'links-unten'},
  {a:180, sym:'←', lbl:'links'},
  {a:225, sym:'↖', lbl:'links-oben'},
  {a:270, sym:'↑', lbl:'oben'},
  {a:315, sym:'↗', lbl:'rechts-oben'},
];

function updateDialUI(){
  const a = dirAngle;
  const rad = a * Math.PI / 180;
  // Dot-Position am Rand des Kreises (Radius ~18px von Mitte bei 52px Dial)
  const r = 17;
  const cx = 26, cy = 26; // Mitte des 52px Kreises
  const dotX = cx + r * Math.cos(rad) - 2.5; // -2.5 = halbe Dot-Breite
  const dotY = cy + r * Math.sin(rad) - 2.5;
  dialDot.style.left = dotX + 'px';
  dialDot.style.top  = dotY + 'px';
  dialDot.style.margin = '0';
  dialDot.style.transform = 'none';

  // Nächste Richtungsbezeichnung
  const idx = Math.round(((a % 360) + 360) % 360 / 45) % 8;
  dialName.textContent = DIR_STEPS[idx].sym + ' ' + DIR_STEPS[idx].lbl;
}

function setDirAngle(a){
  dirAngle = ((a % 360) + 360) % 360;
  updateDialUI();
  render();
}

// Drag-Logik
let dragging = false, lastA = 0;
function pointerAngle(e){
  const rect = dial.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top  + rect.height/2;
  const px = e.touches ? e.touches[0].clientX : e.clientX;
  const py = e.touches ? e.touches[0].clientY : e.clientY;
  return Math.atan2(py-cy, px-cx) * 180/Math.PI;
}
dial.addEventListener('mousedown',  e=>{ dragging=true; lastA=pointerAngle(e); e.preventDefault(); });
dial.addEventListener('touchstart', e=>{ dragging=true; lastA=pointerAngle(e); e.preventDefault(); },{passive:false});
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  const a = pointerAngle(e);
  let d = a - lastA;
  if(d >  180) d -= 360;
  if(d < -180) d += 360;
  lastA = a;
  setDirAngle(dirAngle + d);
});
window.addEventListener('touchmove', e=>{
  if(!dragging) return;
  const a = pointerAngle(e);
  let d = a - lastA;
  if(d >  180) d -= 360;
  if(d < -180) d += 360;
  lastA = a;
  setDirAngle(dirAngle + d);
},{passive:false});
window.addEventListener('mouseup',  ()=>{ if(dragging){ dragging=false; setDirAngle(Math.round(dirAngle/45)*45); }});
window.addEventListener('touchend', ()=>{ if(dragging){ dragging=false; setDirAngle(Math.round(dirAngle/45)*45); }});

// ── Slider ────────────────────────────────────────────────────────────────────
function bindSlider(id, outId, suffix, dispFn, fn){
  g(id).addEventListener('input', function(){
    const v = +this.value;
    g(outId).textContent = (dispFn ? dispFn(v) : Math.round(v)) + suffix;
    if(fn) fn();
  });
}
bindSlider('ptSize',   'ptSizeV',   'px', v=>(v/10).toFixed(1), render);
bindSlider('density',  'densityV',  '',   v=>(v/10).toFixed(1), render);
bindSlider('ptCount',  'ptCountV',  '%',  null, render);
bindSlider('spacing',  'spacingV',  'x',  null, render);
bindSlider('ptAlpha',  'ptAlphaV',  '%',  null, render);
bindSlider('saturation','saturationV','%',null, render);
bindSlider('origAlpha','origAlphaV','%',  null, render);
bindSlider('tailLen',  'tailLenV',  '%',  null, render);
bindSlider('curl',     'curlV',     '',   null, render);
bindSlider('spread',   'spreadV',   '',   null, render);
bindSlider('dissolve', 'dissolveV', '%',  null, render);

// ── Bild laden ────────────────────────────────────────────────────────────────
g('fileIn').addEventListener('change', function(){
  if(!this.files[0]) return;
  const r = new FileReader();
  r.onload = e => {
    const img = new Image();
    img.onload = () => {
      srcImg = img;
      g('dz').classList.add('loaded');
      g('dzLbl').textContent = this.files[0].name;
      buildDots();
      render();
    };
    img.src = e.target.result;
  };
  r.readAsDataURL(this.files[0]);
});

// ── Sättigung ─────────────────────────────────────────────────────────────────
function adjustSaturation(r, g, b, satPct){
  if(satPct >= 100) return [r, g, b];
  const max=Math.max(r,g,b)/255, min=Math.min(r,g,b)/255;
  const gray = Math.round(((max+min)/2)*255);
  const f = satPct/100;
  return [
    Math.round(gray+(r-gray)*f),
    Math.round(gray+(g-gray)*f),
    Math.round(gray+(b-gray)*f)
  ];
}

// ── Punkte sampeln (in Originalgrösse) ───────────────────────────────────────
function buildDots(){
  if(!srcImg) return;
  const step = densityVal();
  const sw = srcImg.width, sh = srcImg.height;
  const offC = document.createElement('canvas');
  offC.width=sw; offC.height=sh;
  const offCtx = offC.getContext('2d');
  offCtx.drawImage(srcImg,0,0,sw,sh);
  const px = offCtx.getImageData(0,0,sw,sh).data;
  dotData=[];
  for(let y=step/2; y<sh; y+=step){
    for(let x=step/2; x<sw; x+=step){
      const i=(Math.floor(y)*sw+Math.floor(x))*4;
      if(px[i+3]<10) continue;
      dotData.push({ nx:x/sw, ny:y/sh, r:px[i], g:px[i+1], b:px[i+2], a:px[i+3] });
    }
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  if(!srcImg){
    cv.width=600; cv.height=300;
    ctx.fillStyle='#111'; ctx.fillRect(0,0,600,300);
    ctx.fillStyle='#444'; ctx.font='14px system-ui'; ctx.textAlign='center';
    ctx.fillText('Bitte ein Foto laden',300,155);
    return;
  }
  buildDots();

  const srcW = srcImg.width, srcH = srcImg.height;
  const tailLen   = +g('tailLen').value/100;
  const angleRad  = dirAngle * Math.PI / 180;
  const dx = Math.cos(angleRad);
  const dy = Math.sin(angleRad);
  const tailPx = Math.max(srcW, srcH) * tailLen;

  // Canvas-Grösse = Originalbild + Rauchfahnen-Ausdehnung
  const padRight  = dx > 0 ? tailPx*dx : 0;
  const padLeft   = dx < 0 ? tailPx*(-dx) : 0;
  const padBottom = dy > 0 ? tailPx*dy : 0;
  const padTop    = dy < 0 ? tailPx*(-dy) : 0;

  const cW = Math.ceil(srcW + padRight + padLeft);
  const cH = Math.ceil(srcH + padBottom + padTop);
  cv.width  = cW;
  cv.height = cH;

  ctx.fillStyle='#111'; ctx.fillRect(0,0,cW,cH);

  const ptSize      = ptSizeVal();
  const ptAlpha     = +g('ptAlpha').value/100;
  const curl        = +g('curl').value;
  const spread      = +g('spread').value;
  const dissolve    = +g('dissolve').value/100;
  const satPct      = +g('saturation').value;
  const origAlpha   = +g('origAlpha').value/100;
  const spacingMult = +g('spacing').value;
  const ptCountPct  = +g('ptCount').value/100;

  const imgX = padLeft;
  const imgY = padTop;

  // Originalbild-Überlagerung
  if(origAlpha > 0){
    ctx.globalAlpha = origAlpha;
    ctx.drawImage(srcImg, imgX, imgY, srcW, srcH);
    ctx.globalAlpha = 1;
  }

  const STEPS   = 20;
  const minDist = ptSize * spacingMult;
  const placed  = [];

  // Punkteanzahl (zufällige Auswahl)
  let dots = dotData;
  if(ptCountPct < 1){
    const count = Math.round(dotData.length * ptCountPct);
    const arr = dotData.slice();
    for(let i=arr.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    dots = arr.slice(0,count);
  }

  // Senkrecht zur Richtung
  const perpX = -dy, perpY = dx;

  dots.forEach(d=>{
    const px = imgX + d.nx*srcW;
    const py = imgY + d.ny*srcH;

    if(minDist > 0){
      for(let p=0; p<placed.length; p++){
        const ddx=placed[p][0]-px, ddy=placed[p][1]-py;
        if(ddx*ddx+ddy*ddy < minDist*minDist) return;
      }
      placed.push([px,py]);
    }

    const [sr,sg,sb] = adjustSaturation(d.r, d.g, d.b, satPct);

    ctx.beginPath();
    ctx.arc(px, py, ptSize/2, 0, Math.PI*2);
    ctx.fillStyle=`rgba(${sr},${sg},${sb},${ptAlpha*d.a/255})`;
    ctx.fill();

    if(tailLen<=0) return;

    for(let s=1; s<=STEPS; s++){
      const t = s/STEPS;
      const noise  = (Math.random()-0.5)*spread*t*2;
      const curlOff = curl*t*t;
      const dist = t*tailPx;

      const tx = px + dx*dist + perpX*(curlOff+noise);
      const ty = py + dy*dist + perpY*(curlOff+noise);

      const alpha = ptAlpha*(d.a/255)*Math.pow(1-t,1.2)*(1-dissolve*t*0.9);
      if(alpha<=0.01) continue;
      const sz = Math.max(0.3,(ptSize/2)*(1-t*dissolve*0.7));

      ctx.beginPath();
      ctx.arc(tx, ty, sz, 0, Math.PI*2);
      ctx.fillStyle=`rgba(${sr},${sg},${sb},${Math.min(1,alpha)})`;
      ctx.fill();
    }
  });
}

g('reBtn').addEventListener('click', render);

// ── Speichern als JPG ──────────────────────────────────────────────────────
g('dlBtn').addEventListener('click', ()=>{
  if(!srcImg) return;
  const baseName = lastSaveName.replace(/_\d+$/, '');
  const suggested = baseName + '_' + String(saveIdx).padStart(3,'0');

  if(window.showSaveFilePicker){
    window.showSaveFilePicker({
      suggestedName: suggested+'.jpg',
      types:[{description:'JPEG Bild',accept:{'image/jpeg':['.jpg','.jpeg']}}]
    }).then(async handle=>{
      const writable = await handle.createWritable();
      cv.toBlob(async blob=>{
        await writable.write(blob);
        await writable.close();
        const sn = handle.name.replace(/\.[^.]+$/,'');
        lastSaveName=sn;
        localStorage.setItem('punktwolke_lastSaveName',sn);
        g('saveInfo').textContent='Gespeichert: '+handle.name;
        saveIdx++;
      },'image/jpeg',0.93);
    }).catch(()=>{});
  } else {
    const name = suggested+'.jpg';
    const a = document.createElement('a');
    a.download=name; a.href=cv.toDataURL('image/jpeg',0.93); a.click();
    lastSaveName=baseName;
    localStorage.setItem('punktwolke_lastSaveName',baseName);
    g('saveInfo').textContent='Gespeichert: '+name;
    saveIdx++;
  }
});

// Init
setDirAngle(0);
render();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
